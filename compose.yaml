services:
  postgres:
    image: postgres:17-alpine
    container_name: pharmacy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmacy
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmacy_dev_password}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pharmacy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pharmacy_postgres_data:
